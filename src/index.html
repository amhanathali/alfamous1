<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfamous — l'atelier du codex</title>
  <meta name="description" content="Étudier le texte coranique par le texte : recherche par verset, mot et racine, mot à mot, racines voisines.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a4b16'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='serif'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème choisi avant l'affichage (évite un éclair blanc).
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    // blog.alfamous.ca (après la bascule depuis Blogger) : l'accueil mène aux articles, l'atelier reste sur atelier.alfamous.ca.
    if (location.hostname === 'blog.alfamous.ca' && !location.hash) location.replace('/articles/');
  </script>
</head>
<body>
  <header class="entete">
    <div class="entete-haut">
      <a class="logo" href="#/">Alfamous<span class="logo-sous">l'atelier du codex</span></a>
      <div class="entete-actions">
        <label class="choix-trad" hidden>
          <span title="Commentaires traditionnels, cités seulement pour la comparaison">Comparer avec</span>
          <select id="traduction"><option value="">aucun commentaire traditionnel</option></select>
        </label>
        <span id="compte" class="compte"></span>
        <button id="theme" class="bouton-icone" type="button" title="Thème clair ou sombre" aria-label="Changer de thème">◐</button>
      </div>
    </div>
    <nav class="menu" id="menu" aria-label="Sections"></nav>
    <form id="formulaire" class="recherche" role="search">
      <div class="champ">
        <input id="requete" type="text" autocomplete="off" spellcheck="false" dir="auto"
          placeholder="2:255 · p 50 · رحم غفر · رحمن رحيم · sabr" aria-label="Rechercher">
        <button id="effacer" type="button" class="effacer" title="Effacer" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <button type="submit" class="bouton-chercher" aria-label="Chercher" title="Chercher">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
      </button>
    </form>
    <div class="options">
      <label title="Le mot doit être exactement le terme cherché"><input id="mot-entier" type="checkbox"> Mot entier</label>
      <label title="Les termes doivent se suivre, dans n'importe quel ordre"><input id="contigus" type="checkbox"> Mots contigus</label>
      <label hidden>Chercher le latin dans
        <select id="source"><option value="coran">la translittération</option><option value="traduction">le commentaire traditionnel</option></select>
      </label>
      <span class="exemples">Exemples :
        <a href="#/q/2:255">2:255</a> <a href="#/q/p%2050">p 50</a>
        <a href="#/q/%D8%B1%D8%AD%D9%85" lang="ar">رحم</a>
        <a href="#/q/%D8%B1%D8%AD%D9%85%20%D8%BA%D9%81%D8%B1" lang="ar">رحم غفر</a>
        <a href="#/q/sabr">sabr</a> <a href="#/stats">statistiques</a>
      </span>
    </div>
  </header>

  <main id="contenu" aria-live="polite"></main>

  <aside id="fiche-mot" class="fiche-mot" hidden></aside>

  <dialog id="fenetre" class="fenetre"></dialog>

  <footer class="pied">
    Alfamous1 — code sous licence GPL v3 ·
    <a href="https://github.com/amhanathali/alfamous1">source</a> ·
    commentaires traditionnels (comparaison) : <a href="https://tanzil.net/trans/">tanzil.net</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
